<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Roadmap to DevOps">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1727"/><stop offset="1" stop-color="#0a111d"/></linearGradient><linearGradient id="line"><stop stop-color="#f2bd67"/><stop offset="1" stop-color="#8d7cff"/></linearGradient><style>
.title{font:700 27px 'DejaVu Sans',Arial,sans-serif;fill:#f0f6fc}.sub{font:15px 'DejaVu Sans',Arial,sans-serif;fill:#9db0c8}.body{font:16px 'DejaVu Sans',Arial,sans-serif;fill:#d8e4f2}.tag{font:700 12px 'DejaVu Sans',Arial,sans-serif;fill:#f2bd67;letter-spacing:2px}.item{transform-box:fill-box;transform-origin:center;animation:rise .6s both;animation-delay:calc(var(--i)*.08s)}.panel{transition:stroke .25s,filter .25s}.panel:hover{stroke:#f2bd67;filter:drop-shadow(0 0 10px #f2bd67)}.item:hover rect{stroke:#f2bd67;fill:#14283b}.scan{animation:scan 5s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@keyframes scan{from{transform:translateY(-40px);opacity:0}20%{opacity:.35}to{transform:translateY(300px);opacity:0}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}</style></defs>
<rect x="8" y="8" width="1184" height="284" rx="22" fill="url(#bg)" stroke="#263b52" stroke-width="2" class="panel"/><rect x="9" y="9" width="1182" height="5" rx="3" fill="url(#line)"/><path class="scan" d="M20 0H1180" stroke="#f2bd67" stroke-width="1" opacity=".25"/><text x="58" y="54" class="tag">ENGINEERING / 05</text><text x="58" y="91" class="title">Roadmap to DevOps</text><text x="58" y="119" class="sub">A practical progression from fundamentals to repeatable deployments.</text><circle cx="1120" cy="56" r="7" fill="#f2bd67" class="pulse"/><circle cx="1120" cy="56" r="14" fill="none" stroke="#f2bd67" opacity=".3" class="pulse"/><g class="item" style="--i:0"><rect x="58" y="148" width="1084" height="29" rx="8" fill="#101e30" stroke="#20354c"/><circle cx="80" cy="162" r="4" fill="#f2bd67"/><text x="98" y="168" class="body">FOUNDATIONS  →  Linux, Git, networking and shell basics</text></g><g class="item" style="--i:1"><rect x="58" y="186" width="1084" height="29" rx="8" fill="#101e30" stroke="#20354c"/><circle cx="80" cy="200" r="4" fill="#f2bd67"/><text x="98" y="206" class="body">CONTAINERS  →  Docker images, containers, volumes and networks</text></g><g class="item" style="--i:2"><rect x="58" y="224" width="1084" height="29" rx="8" fill="#101e30" stroke="#20354c"/><circle cx="80" cy="238" r="4" fill="#f2bd67"/><text x="98" y="244" class="body">DELIVERY  →  CI/CD, cloud basics, monitoring and documentation</text></g></svg>