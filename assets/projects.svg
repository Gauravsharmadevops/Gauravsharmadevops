<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Project Queue">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1727"/><stop offset="1" stop-color="#0a111d"/></linearGradient><linearGradient id="line"><stop stop-color="#73e2ad"/><stop offset="1" stop-color="#8d7cff"/></linearGradient><style>
.title{font:700 27px 'DejaVu Sans',Arial,sans-serif;fill:#f0f6fc}.sub{font:15px 'DejaVu Sans',Arial,sans-serif;fill:#9db0c8}.body{font:16px 'DejaVu Sans',Arial,sans-serif;fill:#d8e4f2}.tag{font:700 12px 'DejaVu Sans',Arial,sans-serif;fill:#73e2ad;letter-spacing:2px}.item{transform-box:fill-box;transform-origin:center;animation:rise .6s both;animation-delay:calc(var(--i)*.08s)}.panel{transition:stroke .25s,filter .25s}.panel:hover{stroke:#73e2ad;filter:drop-shadow(0 0 10px #73e2ad)}.item:hover rect{stroke:#73e2ad;fill:#14283b}.scan{animation:scan 5s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@keyframes scan{from{transform:translateY(-40px);opacity:0}20%{opacity:.35}to{transform:translateY(300px);opacity:0}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}</style></defs>
<rect x="8" y="8" width="1184" height="284" rx="22" fill="url(#bg)" stroke="#263b52" stroke-width="2" class="panel"/><rect x="9" y="9" width="1182" height="5" rx="3" fill="url(#line)"/><path class="scan" d="M20 0H1180" stroke="#73e2ad" stroke-width="1" opacity=".25"/><text x="58" y="54" class="tag">ENGINEERING / 04</text><text x="58" y="91" class="title">Project Queue</text><text x="58" y="119" class="sub">Planned starter builds — progress will be updated when each is published.</text><circle cx="1120" cy="56" r="7" fill="#73e2ad" class="pulse"/><circle cx="1120" cy="56" r="14" fill="none" stroke="#73e2ad" opacity=".3" class="pulse"/><g class="item" style="--i:0"><rect x="58" y="148" width="1084" height="29" rx="8" fill="#101e30" stroke="#20354c"/><circle cx="80" cy="162" r="4" fill="#73e2ad"/><text x="98" y="168" class="body">01 / Static portfolio with semantic HTML and responsive layout</text></g><g class="item" style="--i:1"><rect x="58" y="186" width="1084" height="29" rx="8" fill="#101e30" stroke="#20354c"/><circle cx="80" cy="200" r="4" fill="#73e2ad"/><text x="98" y="206" class="body">02 / Dockerized sample web app with reproducible local setup</text></g><g class="item" style="--i:2"><rect x="58" y="224" width="1084" height="29" rx="8" fill="#101e30" stroke="#20354c"/><circle cx="80" cy="238" r="4" fill="#73e2ad"/><text x="98" y="244" class="body">03 / GitHub Actions workflow for automated checks and deployment</text></g></svg>