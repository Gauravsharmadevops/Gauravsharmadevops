<text x="34" y="43" fill="#67E8F9" font-family="monospace" font-size="22" font-weight="700">01 / ABOUT ME</text><text x="36" y="78" fill="#E2E8F0" font-family="Arial,sans-serif" font-size="16">I am a BCA student at Maharishi University of Information Technology, building my</text><text x="36" y="103" fill="#E2E8F0" font-family="Arial,sans-serif" font-size="16">foundation in DevOps one practical step at a time. I have an IBM course certificate</text><text x="36" y="128" fill="#E2E8F0" font-family="Arial,sans-serif" font-size="16">and I am growing from beginner level through hands-on labs, notes and small projects.</text><text x="36" y="155" fill="#A78BFA" font-family="monospace" font-size="13">CURRENT MODE: LEARN → BUILD → DOCUMENT → IMPROVE</text></svg>