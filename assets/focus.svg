<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Current Focus">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1727"/><stop offset="1" stop-color="#0a111d"/></linearGradient><linearGradient id="line"><stop stop-color="#8b86ff"/><stop offset="1" stop-color="#8d7cff"/></linearGradient><style>
.title{font:700 27px 'DejaVu Sans',Arial,sans-serif;fill:#f0f6fc}.sub{font:15px 'DejaVu Sans',Arial,sans-serif;fill:#9db0c8}.body{font:16px 'DejaVu Sans',Arial,sans-serif;fill:#d8e4f2}.tag{font:700 12px 'DejaVu Sans',Arial,sans-serif;fill:#8b86ff;letter-spacing:2px}.item{transform-box:fill-box;transform-origin:center;animation:rise .6s both;animation-delay:calc(var(--i)*.08s)}.panel{transition:stroke .25s,filter .25s}.panel:hover{stroke:#8b86ff;filter:drop-shadow(0 0 10px #8b86ff)}.item:hover rect{stroke:#8b86ff;fill:#14283b}.scan{animation:scan 5s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@keyframes scan{from{transform:translateY(-40px);opacity:0}20%{opacity:.35}to{transform:translateY(300px);opacity:0}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}</style></defs>
